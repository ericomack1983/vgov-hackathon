<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Ergonomic office chair">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2b34"/><stop offset="1" stop-color="#07111a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="16%" r="72%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.45"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3b44"/><stop offset="1" stop-color="#142a31"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#glow)"/>
  <ellipse cx="200" cy="252" rx="120" ry="16" fill="#000" opacity="0.35"/>
  <!-- backrest -->
  <path d="M168 66 q56 -8 60 70 q2 26 -8 40 l-44 -6 q-8 -52 -8 -104 Z" fill="url(#seat)" stroke="#3fae9c" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M180 78 q34 0 40 56" fill="none" stroke="#2dd4bf" stroke-opacity="0.4" stroke-width="2"/>
  <!-- seat -->
  <path d="M150 168 q60 -14 96 6 q6 18 -10 26 q-44 14 -84 2 q-10 -18 -2 -34 Z" fill="url(#seat)" stroke="#3fae9c" stroke-opacity="0.5" stroke-width="2"/>
  <!-- armrest -->
  <path d="M150 150 q-18 4 -18 26" fill="none" stroke="#46667e" stroke-width="6" stroke-linecap="round"/>
  <!-- gas cylinder -->
  <rect x="194" y="198" width="10" height="38" rx="3" fill="#39507f"/>
  <!-- 5-star base -->
  <g stroke="#46667e" stroke-width="7" stroke-linecap="round">
    <line x1="199" y1="236" x2="150" y2="262"/>
    <line x1="199" y1="236" x2="199" y2="268"/>
    <line x1="199" y1="236" x2="248" y2="262"/>
    <line x1="199" y1="236" x2="168" y2="256"/>
    <line x1="199" y1="236" x2="232" y2="256"/>
  </g>
  <g fill="#2dd4bf">
    <circle cx="148" cy="264" r="6"/><circle cx="199" cy="270" r="6"/><circle cx="250" cy="264" r="6"/>
  </g>
</svg>

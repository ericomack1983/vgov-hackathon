<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Security appliance">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#341022"/><stop offset="1" stop-color="#0a0814"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="18%" r="72%">
      <stop offset="0" stop-color="#ff2d55" stop-opacity="0.4"/><stop offset="1" stop-color="#ff2d55" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2746"/><stop offset="1" stop-color="#171327"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1434cb"/><stop offset="1" stop-color="#1b4dff"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#glow)"/>
  <ellipse cx="200" cy="236" rx="150" ry="18" fill="#000" opacity="0.35"/>
  <rect x="64" y="132" width="272" height="74" rx="10" fill="url(#metal)"/>
  <rect x="64" y="132" width="272" height="74" rx="10" fill="none" stroke="#5a4f86" stroke-width="1.5"/>
  <g fill="#39507f">
    <rect x="80" y="186" width="36" height="8" rx="3"/><rect x="122" y="186" width="36" height="8" rx="3"/>
    <rect x="164" y="186" width="36" height="8" rx="3"/>
  </g>
  <circle cx="300" cy="150" r="4" fill="#ff2d55"/><circle cx="314" cy="150" r="4" fill="#2dd4bf"/>
  <!-- shield -->
  <path d="M200 102 l30 10 v26 q0 30 -30 42 q-30 -12 -30 -42 v-26 Z" fill="url(#shield)" stroke="#4f74ff" stroke-width="1.5"/>
  <path d="M188 152 l9 9 17 -20" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
